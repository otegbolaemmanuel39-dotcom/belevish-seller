<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seller dashboard – Belevish Hair Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="seller.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top"><div class="wrap bar"><div class="logo">Belevish · Seller</div>
<div class="acts"><button class="ib" id="themeBtn" aria-label="Toggle dark mode">◐</button><a class="ghost" href="#" id="viewStore" style="margin:0;padding:8px 16px">View store</a><button class="cartbtn" id="out" hidden>Log out</button></div></div></header>
<main class="wrap sec">
<section id="login" class="narrow"><h2>Seller login</h2>
<form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label>
<label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
<button class="cta" type="submit" style="width:100%;margin-top:16px">Log in</button><p class="msg" id="lmsg" role="status"></p></form></section>

<section id="dash" hidden>
<div class="tabs"><button class="chip" data-tab="products" aria-pressed="true">Products</button><button class="chip" data-tab="orders" aria-pressed="false">Orders</button><button class="chip" data-tab="bookings" aria-pressed="false">Bookings</button></div>

<div id="t-products">
<form id="pf" class="pf"><h3 class="full" id="pft">Add a wig</h3>
<label>Name<input name="name" required></label>
<label>Style<select name="style"><option>Straight</option><option>Wavy</option><option>Curly</option><option>Bob</option></select></label>
<label>Price ($)<input name="price" type="number" min="0" step="1" required></label>
<label>Length<input name="hair_length" placeholder="24 in"></label>
<label>Colour<input name="color" placeholder="Jet Black"></label>
<label>Hair type<input name="hair_type" placeholder="Human hair blend"></label>
<label>Density<input name="density" placeholder="180%"></label>
<label>Cap<input name="cap" placeholder="Lace front, adjustable"></label>
<label>Lasts<input name="lifespan" placeholder="9–12 months"></label>
<label class="full">Photo<input id="file" type="file" accept="image/*"></label>
<label class="chk"><input type="checkbox" name="in_stock" checked> In stock</label>
<label class="chk"><input type="checkbox" name="active" checked> Show on store</label>
<div class="full"><button class="cta" type="submit">Save wig</button> <button class="ghost" type="button" id="cancel" hidden>Cancel edit</button><p class="msg" id="pmsg" role="status"></p></div></form>
<div id="plist"></div></div>

<div id="t-orders" hidden></div>
<div id="t-bookings" hidden></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="seller.js"></script>
</body>
</html>
